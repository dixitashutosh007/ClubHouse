<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b4482a" />
    <title>Offline · Club House</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff8ed; color: #263238; }
      main { max-width: 22rem; margin: 1rem; padding: 2rem 1.5rem; text-align: center; background: #fff;
        border: 1px solid #eadfcf; border-radius: 1rem; box-shadow: 0 10px 30px rgba(38, 50, 56, 0.08); }
      h1 { font-size: 1.25rem; margin: 0.75rem 0 0.5rem; }
      p { font-size: 0.9375rem; line-height: 1.5; color: #5b6670; margin: 0 0 1.25rem; }
      button { font: inherit; font-size: 0.9375rem; font-weight: 600; color: #fff; background: #b4482a;
        border: 0; border-radius: 0.625rem; min-height: 44px; padding: 0.7rem 1.4rem; cursor: pointer; }
      button:focus-visible { outline: 3px solid #263238; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>Club House needs an internet connection to show rides and requests. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
