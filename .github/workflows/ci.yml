name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and route tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Tailwind runs only in the Turbopack build; a build without it ships an unstyled app
      - name: Check the built CSS includes the app's styles
        run: |
          if ! grep -rqs "bg-ivory" --include="*.css" .next/static; then
            echo "Built CSS has no Tailwind utilities: is the build using Turbopack (next build)?"
            exit 1
          fi

  # Real pages in a browser, against the development server and its demo data
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
